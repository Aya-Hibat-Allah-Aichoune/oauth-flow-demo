name: oauth-flow-demo

x-service-credentials: &service-credentials
  SERVICE_CLIENT_ID: ${SERVICE_CLIENT_ID:-data-service}
  SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:-data-service-secret}

services:
  auth-server:
    build:
      context: .
      target: auth-server
    environment:
      <<: *service-credentials
      AUTH_SERVER_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-0123456789}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-900}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  service:
    build:
      context: .
      target: service
    environment:
      <<: *service-credentials
      SERVICE_PORT: 4001
      AUTH_SERVER_URL: http://auth-server:4000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4001:4001'
    depends_on:
      auth-server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  client:
    build:
      context: .
      target: client
      args:
        VITE_AUTH_URL: http://localhost:4000
        VITE_SERVICE_URL: http://localhost:4001
    ports:
      - '5173:80'
    depends_on:
      service:
        condition: service_healthy
